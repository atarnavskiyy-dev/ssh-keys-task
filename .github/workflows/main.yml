name: Check SSH Keys

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  check-ssh-keys:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set Permissions for Private Key One
        env:
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY_ONE }}
        run: |
          printf '%s\n' "$PRIVATE_KEY" > private_key_one
          chmod 400 private_key_one

      - name: Set Permissions for Private Key Two
        env:
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY_TWO }}
        run: |
          printf '%s\n' "$PRIVATE_KEY" > private_key_two
          chmod 400 private_key_two

      - name: Verify RSA key type
        run: ssh-keygen -l -f ./keys/task1/key.pub | grep RSA

      - name: Verify RSA key length
        run: ssh-keygen -l -f ./keys/task1/key.pub | grep 2048

      - name: Verify RSA private and public key match
        run: |
          generated_key=$(ssh-keygen -y -f private_key_one | cut -d' ' -f 2)
          grep -F "$generated_key" ./keys/task1/key.pub

      - name: Verify Ed25519 key type
        run: ssh-keygen -l -f ./keys/task2/key.pub | grep ED25519

      - name: Verify Ed25519 private and public key match
        run: |
          generated_key=$(ssh-keygen -y -f private_key_two | cut -d' ' -f 2)
          grep -F "$generated_key" ./keys/task2/key.pub

      - name: Cleanup private keys
        if: always()
        run: rm -f private_key_one private_key_two

